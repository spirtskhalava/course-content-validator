[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-content-validator"
version = "0.1.0"
description = "QA checks for course content: metadata, freshness, outdated versions, broken links, quiz answer keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ccv = "ccv.cli:main"
ccv-mcp = "ccv.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
